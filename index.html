<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<Style>
    
*{
margin:0;
padding:0;

}

html, body {
  margin: 0;
  height: 100%;
}

#heading .menu{

    margin:0px 80px;
    padding: 20px 20px;
    text-transform: uppercase;
    justify-content: space-between;
    display: flex;
    border-radius: 10px;
    text-align: center;
    
}

.logo{

    padding: 10px 70px;
    text-transform: uppercase;
    justify-content: space-between;
    display: flex;

}

header a {

    margin: 0 0;
    padding: 0 0;
    text-decoration: none;
    color:rgb(255, 255, 255);
    font-family: sans-serif;
    justify-content: space-between;
    display: block;
    
}

.titulo{
    align: center;
    display: block;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: rgb(255, 255, 255);
    font-family: "Netflix Sans", "Helvetica Neue", "Segoe UI", Roboto, Ubuntu, sans-serif;
    text-align: center;
    font-size: 20px;
}

body{
    background-image:
        linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),  /* escurecimento */
        url('fundo.jpg');                                          /* imagem */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    min-height: 100vh;   /* troque "height: 100%" por isso */
    width: auto;
    overflow: hidden;
}

form{
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
}

header{
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: rgb(255, 255, 255);
    padding: 10px;

}

header h3{
    font-size: 15px;
    padding: 5px 5px;
    height: 5px;
    background-color: rgb(255, 4, 4);
    text-align: center;
}

.botao{
    background-color: rgb(255, 4, 4);
    color: rgb(255, 255, 255);
    padding: 10px 20px;
    border: none;
    cursor: pointer;
    height: 50px;
    width: auto;
}

input{
    
    width: 400px;
    height: 50px;

}
</Style>

<body>
    <header id="heading">
        <a href="#" ><img class="logo" src="logo.png" alt="Netflix" width="150" margin-left="200px"></a>
        <h3 class="menu"><a href="#">Entrar</a></h3>
    </header>
    <br>
        <br>
            <br>
                 <br>
                     <br>
                         <br>
                            <br>
                                 
    <div class="titulo">

        <h1>Filmes, séries e muito mais,<br> sem limites</h1>
        <br>
        <h3>A partir de R$ 25,90. Cancele quando quiser.</h3>
        <br>
        <h4>Quer assistir? Informe seu email para criar ou reiniciar sua assinatura.</h4>
        <br>
        <form action="https://www.netflix.com/br/login" method="get">
            <input type="email" name="email" placeholder="Email" required>
            <button type="submit" class="botao">Vamos lá</button>

    </div>
</body>
</html>
